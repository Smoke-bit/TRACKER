<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Life OS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d131b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 380px;
            padding: 40px;
            background: #111820;
            border: 1px solid #263341;
            border-radius: 14px;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #8b9bb0;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #263341;
            background: #080d12;
            color: white;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #c6ff00;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>LIFE OS</h1>
        <p>Private Life OS</p>

        <form id="login-form">

            <input
                type="email"
                id="login-email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="login-password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>

    <script>
        const form = document.getElementById("login-form");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email =
                document.getElementById("login-email").value.trim();

            const password =
                document.getElementById("login-password").value;

            message.textContent = "Logging in...";

            const { data, error } =
    await window.supabaseClient.auth.signInWithPassword({
        email,
        password
    });

            if (error) {
                message.textContent = error.message;
                return;
            }

            window.location.href = "index.html";
        });
    </script>

</body>
</html>
