<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance | Life OS</title>

    <link rel="stylesheet" href="../css/finance.css">

</head>

<body>

    <!-- ===============================
         HEADER
         =============================== -->

    <header class="finance-header">

        <div class="header-left">

            <a href="index.html" class="back-button">
                ← Life OS
            </a>

            <div>
                <h1>Finance</h1>
                <p>Track and manage your money.</p>
            </div>

        </div>

        <div class="header-right">

            <div id="current-date"></div>
            <div id="current-time"></div>

        </div>

    </header>


    <!-- ===============================
         MAIN
         =============================== -->

    <main class="finance-main">

    <!-- ===============================
         TODAY
         =============================== -->

    <section class="finance-section">

        <div class="section-header">

    <div>
        <h2>Spending</h2>
        <p id="finance-date">
            6 October 2026
        </p>
    </div>

    <div class="today-total">
        ₹0
    </div>

</div>


<div class="finance-date-controls">

    <button
        type="button"
        id="previous-day"
        class="date-nav-button"
    >
        ←
    </button>

    <button
    type="button"
    id="selected-date"
    class="selected-date"
>
    6 October 2026
    <span class="date-chevron">▾</span>
</button>

<div
    id="calendar-dropdown"
    class="calendar-dropdown hidden"
>
    <!-- Calendar will be generated by JS -->
</div>

    <button
        type="button"
        id="next-day"
        class="date-nav-button"
    >
        →
    </button>

</div>


        <!-- ADD EXPENSE -->

        <div class="expense-entry">

            <div class="input-group">

                <label for="expense-name">
                    What did you buy?
                </label>

                <input
                    type="text"
                    id="expense-name"
                    placeholder="e.g. Creatine"
                >

            </div>


            <div class="input-group">

                <label for="expense-amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="expense-amount"
                    placeholder="0"
                    min="0"
                    step="0.01"
                >

            </div>


            <button
                type="button"
                id="add-expense-button"
                class="add-expense-button"
            >
                Add Expense
            </button>

        </div>


        <!-- TODAY'S EXPENSES -->

        <div class="expenses-list" id="expenses-list">

            <!-- Expenses will appear here -->

        </div>

    </section>

    
<!-- ===============================
     MONTHLY SPENDING CHART
     =============================== -->

<section class="finance-section">

    <div class="section-header">
        <div>
            <h2>Monthly Spending</h2>
            <p>Your daily spending this month.</p>
        </div>
    </div>

    <div class="monthly-chart-card">
        <div class="monthly-chart-total">
            <span>Total this month</span>
            <strong id="monthly-chart-total">₹0</strong>
        </div>

        <div class="monthly-chart-container">
            <svg
                id="monthly-spending-chart"
                viewBox="0 0 700 250"
                role="img"
                aria-label="Daily spending line chart for the current month"
            ></svg>
        </div>
    </div>

</section>

    <!-- ===============================
         SUMMARY
         =============================== -->

    <section class="finance-section">

        <div class="section-header">

            <div>
                <h2>Summary</h2>
                <p>Your spending overview.</p>
            </div>

        </div>

        <div class="finance-summary-grid">

            <div class="summary-card">

                <span class="summary-label">
                    Today
                </span>

                <span
                    class="summary-value"
                    id="summary-today"
                >
                    ₹0
                </span>

            </div>


            <div class="summary-card">

                <span class="summary-label">
                    This Week
                </span>

                <span
                    class="summary-value"
                    id="summary-week"
                >
                    ₹0
                </span>

            </div>


            <div class="summary-card">

                <span class="summary-label">
                    This Month
                </span>

                <span
                    class="summary-value"
                    id="summary-month"
                >
                    ₹0
                </span>

            </div>

        </div>

    </section>

</main>


    <!-- ===============================
         FOOTER
         =============================== -->

    <footer class="finance-footer">

        <p>Life OS · Finance</p>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/finance.js"></script>

</body>

</html>
